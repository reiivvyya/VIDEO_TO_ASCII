<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>AKMAL ASCII CAT</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><p class="eyebrow">A K M A L PROJECT</p><h1>AKMAL<span>_</span>ASCII</h1><p class="sub">a little cat, made of characters.</p></header><section class="screen"><div class="bar"><span>● LIVE ASCII OUTPUT</span><span id="status">WAITING</span></div><pre id="output">UPLOAD AKMAL'S VIDEO</pre><div class="bar foot">FRAME <span id="frameCount">0000</span></div></section><section class="panel"><label class="picker" for="videoFile"><b>01 / CHOOSE AKMAL VIDEO</b><small id="videoName">Select cat video (MP4 / WebM)</small></label><input id="videoFile" type="file" accept="video/*"><label class="picker" for="audioFile"><b>02 / ADD RIGHT NOW MUSIC</b><small id="audioName">Select music file (MP3 / M4A / WAV)</small></label><input id="audioFile" type="file" accept="audio/*"><div class="setting"><label>ASCII DETAIL <strong id="widthValue">85</strong></label><input id="width" type="range" min="35" max="140" value="85"></div><div class="setting"><label>ANIMATION SPEED <strong id="fpsValue">12 FPS</strong></label><input id="fps" type="range" min="4" max="24" value="12"></div><div class="buttons"><button id="play" disabled>▶ PLAY</button><button id="pause" disabled>Ⅱ PAUSE</button><button id="stop" disabled>■ STOP</button></div><p class="hint">Choose Akmal's video and your Right Now audio file from your phone. Both play locally in your browser.</p></section><video id="video" playsinline></video><canvas id="canvas"></canvas><footer>MADE FOR AKMAL · ASCII CAT</footer></main><script src="script.js"></script></body></html>
