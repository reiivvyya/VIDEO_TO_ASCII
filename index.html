<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>VIDEO_TO_ASCII</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">CREATIVE EXPERIMENT / 001</p>
      <h1>VIDEO<span>_</span>TO<span>_</span>ASCII</h1>
      <p class="sub">Turn your video into moving text.</p>
    </header>

    <section class="screen">
      <div class="screen-top">
        <span><i></i> LIVE OUTPUT</span>
        <span id="status">WAITING FOR VIDEO</span>
      </div>
      <pre id="output" aria-label="ASCII video output">UPLOAD A VIDEO TO BEGIN</pre>
    </section>

    <section class="controls">
      <label class="upload" for="videoFile">
        <span class="upload-icon">＋</span>
        <span><b>CHOOSE VIDEO</b><small>MP4, WebM, or supported video</small></span>
      </label>
      <input id="videoFile" type="file" accept="video/*">

      <div class="control-row">
        <label for="width">ASCII WIDTH <strong id="widthValue">80</strong></label>
        <input id="width" type="range" min="35" max="140" value="80">
      </div>
      <div class="control-row">
        <label for="fps">FRAME RATE <strong id="fpsValue">12 FPS</strong></label>
        <input id="fps" type="range" min="4" max="24" value="12">
      </div>
      <div class="buttons">
        <button id="playBtn" disabled>▶ PLAY</button>
        <button id="pauseBtn" disabled>Ⅱ PAUSE</button>
        <button id="stopBtn" disabled>■ STOP</button>
      </div>
      <p class="note">Video diproses langsung di browser kamu. File tidak diunggah ke server.</p>
    </section>
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    <footer>BUILT WITH HTML · CSS · JAVASCRIPT <span>●</span></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
